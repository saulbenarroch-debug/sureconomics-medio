name: Vigilancia

# Cada CUARTO DE HORA en horario de redaccion. Mira si ha pasado algo gordo y AVISA por
# Telegram. NO escribe: la decision del 01/09/2026 fue que ninguna pieza se
# produzca sin que una persona la haya pedido.
#
# Barato a proposito: no llama a la IA ni a Tavily. La puntuacion la hace
# criterio.py, que es codigo, y el filtro de palabras corta la mayoria de las
# horas antes de gastar nada. Lo unico que cuesta una llamada es preguntarle al
# sitio que hay publicado, y eso solo pasa cuando algo ya supero el umbral.
#
# De 11:00 a 23:00 UTC, que son las 7 de la mañana a las 7 de la tarde en
# Venezuela. Fuera de esa franja no hay nadie leyendo el grupo, y un aviso que
# nadie ve solo sirve para que el siguiente se ignore tambien.
#
# EL RELOJ ES EL CRON DEL WORKER (VIGILANCIA_CRON en worker.js), no el schedule
# de GitHub. Paso de una ronda por hora a una cada quince minutos el 18/09/2026,
# cuando se midio que el schedule llegaba de 20 minutos a dos horas tarde.
on:
  workflow_dispatch:
    inputs:
      horas:
        description: "ventana hacia atras"
        default: "2"
      ensayo:
        description: "true = no manda el aviso, solo lo imprime"
        default: "false"
  # AQUI NO SE DEJA EL schedule: DE RED, Y ES UNA EXCEPCION DELIBERADA.
  #
  # diario.yml si lo conserva -si Cloudflare falla, la tanda llega tarde pero
  # llega- porque perder una tanda cuesta seis piezas. Aqui perder una ronda
  # cuesta quince minutos: la siguiente la recoge.
  #
  # Y mantenerlo tenia un coste real. Medido del 16 al 18/09/2026, el schedule
  # de las 23:00 aparecio a las 00:53 y a las 00:57: avisos de alto impacto
  # llegando al grupo pasada la medianoche, cuando no hay nadie. Un aviso que
  # nadie ve hace que el siguiente tambien se ignore.
  #
  # El reloj es VIGILANCIA_CRON en worker.js, que es puntual.

# El estado de lo ya avisado se guarda en el repo. Sin esto, cada corrida
# empieza en blanco y vuelve a avisar de lo mismo cada hora.
permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ronda
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          VIGILANCIA_CHAT_ID: ${{ secrets.VIGILANCIA_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python vigilar.py \
            --horas "${{ github.event.inputs.horas || '2' }}" \
            ${{ github.event.inputs.ensayo == 'true' && '--ensayo' || '' }}

      # Se recuerda lo avisado para no repetirlo la hora siguiente. Se comitea
      # solo si cambio: un commit vacio cada hora ensucia el historico.
      - name: Recordar lo avisado
        if: github.event.inputs.ensayo != 'true'
        run: |
          if [ -n "$(git status --porcelain vigilancia_estado.json)" ]; then
            git config user.name "vigilancia"
            git config user.email "vigilancia@sureconomics.com"
            git add vigilancia_estado.json
            git commit -m "Vigilancia: enlaces avisados [skip ci]"
            git push
          else
            echo "Nada nuevo que recordar."
          fi
