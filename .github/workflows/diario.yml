name: Corrida diaria

# DOS TANDAS AL DIA, hora de Venezuela:
#   8:00 am  = 12:00 UTC   (tanda "manana")
#   2:00 pm  = 18:00 UTC   (tanda "tarde")
#
# La de la tarde NO repite la de la mañana: orquestar.py consulta la API publica
# del sitio y descarta lo que ya esta publicado (ver motor/memoria.py). Por eso
# pide el triple de candidatos de los que necesita, para que le quede margen
# despues de filtrar.
#
# Se deja el disparo manual ademas del programado a proposito. En este grupo de
# proyectos ya se aprendio que el "schedule" de GitHub llega con retrasos de
# hasta media hora, y por eso el bot de Telegram lo dispara desde un cron
# externo (cron-job.org) que llama a workflow_dispatch. Aqui el schedule queda
# como red de seguridad: si el cron externo falla, la corrida sale igual aunque
# sea tarde.
#
# Y POR ESO EXISTE EL JOB "guardia". Con el cron externo puesto, las dos vias
# disparan la misma tanda y salen DOCE borradores en vez de seis. La memoria no
# lo evita, porque la primera tanda deja borradores y la memoria solo ve lo
# publicado. La guardia bloquea al segundo, pero SOLO cuando viene del schedule:
# si lo pide una persona o el cron externo, corre siempre, porque un disparo
# pedido a mano es una decision y no un accidente.
on:
  workflow_dispatch:
    inputs:
      tanda:
        description: "manana o tarde"
        default: "manana"
      piezas:
        description: "Cuantas piezas producir"
        default: "6"
      sin_subir:
        description: "true = solo correo, no toca el panel"
        default: "false"
  schedule:
    - cron: "0 12 * * 1-5"   # 8:00 am Venezuela
    - cron: "0 18 * * 1-5"   # 2:00 pm Venezuela

# Se apunta que tanda salio y cuando, para que la guardia lo sepa.
permissions:
  contents: write

# Dos corridas a la vez se pisarian los archivos de trabajo. La segunda espera.
concurrency:
  group: corrida-diaria
  cancel-in-progress: false

jobs:
  guardia:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.mirar.outputs.seguir }}
      tanda: ${{ steps.mirar.outputs.tanda }}
    steps:
      - uses: actions/checkout@v4

      - name: Que tanda es, y si ya salio
        id: mirar
        run: |
          # El schedule no puede pasar inputs, pero SI dice que cron lo disparo,
          # y eso es lo que hay que mirar. Deducirlo del reloj estaba mal: el
          # 01/09/2026 el cron de las 12:00 UTC llego a las 16:22, con cuatro
          # horas y veinte de retraso, y como la regla era "antes de las 15 es
          # mañana", la tanda de la mañana se etiqueto "tarde". Con la guardia
          # puesta eso ademas habria bloqueado la tanda real de las 18:00: la de
          # la mañana no habria salido y la de la tarde tampoco.
          #
          # github.event.schedule trae la expresion exacta, sin importar cuanto
          # tarde en llegar.
          CRON="${{ github.event.schedule }}"
          if [ -n "${{ github.event.inputs.tanda }}" ]; then
            TANDA="${{ github.event.inputs.tanda }}"
          elif [ "$CRON" = "0 12 * * 1-5" ]; then
            TANDA="manana"
          elif [ "$CRON" = "0 18 * * 1-5" ]; then
            TANDA="tarde"
          else
            # Cron desconocido: alguien toco los horarios y no actualizo esto.
            # Se avisa en vez de adivinar en silencio.
            echo "::warning::cron '$CRON' no reconocido; deduzco la tanda del reloj"
            if [ "$(date -u +%H)" -lt 15 ]; then TANDA="manana"; else TANDA="tarde"; fi
          fi
          echo "cron que disparo: '$CRON' -> tanda '$TANDA'"
          echo "tanda=$TANDA" >> $GITHUB_OUTPUT

          HOY=$(date -u +%F)
          # Se arma el patron con comillas sueltas para no meter barras
          # invertidas: en este proyecto ya se han perdido dos veces por el
          # camino y una barra mal escapada no la ve ningun comprobador.
          MARCA='"'$TANDA'": "'$HOY'"'

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Disparo pedido. Corre igual."
            echo "seguir=si" >> $GITHUB_OUTPUT
          elif [ -f ultima_corrida.json ] && grep -qF "$MARCA" ultima_corrida.json; then
            echo "La tanda '$TANDA' de hoy ya salio. El schedule no la repite."
            echo "seguir=no" >> $GITHUB_OUTPUT
          else
            echo "La tanda '$TANDA' de hoy no ha salido."
            echo "seguir=si" >> $GITHUB_OUTPUT
          fi

  producir:
    needs: guardia
    if: needs.guardia.outputs.seguir == 'si'
    runs-on: ubuntu-latest
    # Escribir seis piezas con auditoria lleva su tiempo. El limite existe para
    # que una corrida colgada no se coma la cuota de Actions del mes.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # SE APUNTA ANTES DE EMPEZAR, no al terminar. Una corrida dura cuarenta
      # minutos y el schedule puede llegar con media hora de retraso: si se
      # apuntara al final, el duplicado arrancaria mientras esta corriendo la
      # primera y la guardia no habria servido de nada.
      - name: Apuntar la tanda
        run: |
          python -c "
          import json, pathlib, sys
          p = pathlib.Path('ultima_corrida.json')
          d = json.loads(p.read_text()) if p.exists() else {}
          d[sys.argv[1]] = sys.argv[2]
          p.write_text(json.dumps(d, indent=2, sort_keys=True) + chr(10))
          " "${{ needs.guardia.outputs.tanda }}" "$(date -u +%F)"
          git config user.name "corrida"
          git config user.email "corrida@sureconomics.com"
          git add ultima_corrida.json
          git commit -m "Tanda ${{ needs.guardia.outputs.tanda }} en marcha [skip ci]" || true
          git push || echo "No pude apuntar la tanda. Sigo: es peor no publicar."

      - run: pip install -r requirements.txt

      - name: Corrida
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Cuenta de servicio del robot, NO la de una persona: el servidor
          # atribuye cada pieza a la cuenta que la crea.
          SURECONOMICS_API: ${{ secrets.SURECONOMICS_API }}
          # Cuenta de servicio del panel. NO es un token fijo: este backend solo
          # tiene login con correo y contraseña, y sesiones de una hora.
          SURECONOMICS_USUARIO: ${{ secrets.SURECONOMICS_USUARIO }}
          SURECONOMICS_CLAVE: ${{ secrets.SURECONOMICS_CLAVE }}
          # Envio del correo, reutiliza la cuenta de La Campana.
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          REMITENTE_NOMBRE: ${{ secrets.REMITENTE_NOMBRE }}
        run: |
          python orquestar.py --tanda "${{ needs.guardia.outputs.tanda }}" --piezas "${{ github.event.inputs.piezas || '6' }}" ${{ github.event.inputs.sin_subir == 'true' && '--sin-subir' || '' }}

      # Los borradores del dia se guardan aunque la subida al panel falle. Si
      # algo sale mal, el texto no se pierde: queda aqui para rescatarlo.
      - name: Guardar lo producido
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: borradores-${{ needs.guardia.outputs.tanda }}
          path: |
            corrida-*/
            carga-*.json
          retention-days: 14
