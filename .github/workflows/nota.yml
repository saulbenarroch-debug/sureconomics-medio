name: Nota a peticion

# Lo dispara el comando /nota del bot de Telegram. Alguien de la redaccion ve
# algo que el robot no ha cogido, pega el enlace en el chat y esto corre la
# cadena completa: fuente, expediente, cifras, redaccion, auditoria y correo.
#
# El Worker de Cloudflare ya sabe hacer esto: dispara entorno.yml del mismo
# modo. Ver cloudflare-worker/worker.js en telegram-finance-bot.
#
# Sin "schedule": esto solo corre cuando alguien lo pide.
on:
  workflow_dispatch:
    inputs:
      enlace:
        description: "Direccion de la nota"
        default: ""
      foto:
        description: "file_id de una captura mandada al bot"
        default: ""
      quien:
        description: "Quien la pidio (para el correo)"
        default: ""
      tipo:
        description: "Noticia, Opinión, Editorial, Investigación, Educación"
        default: "Noticia"
      chat:
        description: "Chat de Telegram al que devolver el borrador"
        default: ""
      encargo:
        description: "Instruccion de edicion (en Telegram, el pie de foto)"
        default: ""

jobs:
  escribir:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Escribir la nota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          REMITENTE_NOMBRE: ${{ secrets.REMITENTE_NOMBRE }}
          # Para devolver el borrador al chat que lo pidio. El correo va igual:
          # esto es un extra, no el canal principal.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # Para dejar el borrador en el panel. Sin esto escribe y entrega, pero
          # no sube: nota.py se salta el paso y lo dice.
          SURECONOMICS_API: ${{ secrets.SURECONOMICS_API }}
          SURECONOMICS_USUARIO: ${{ secrets.SURECONOMICS_USUARIO }}
          SURECONOMICS_CLAVE: ${{ secrets.SURECONOMICS_CLAVE }}
        run: |
          python nota.py "${{ github.event.inputs.enlace }}" --foto "${{ github.event.inputs.foto }}" --tipo "${{ github.event.inputs.tipo }}" --quien "${{ github.event.inputs.quien }}" --chat "${{ github.event.inputs.chat }}" --encargo "${{ github.event.inputs.encargo }}"

      - name: Guardar lo producido
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peticion
          path: peticion-*/
          retention-days: 14
