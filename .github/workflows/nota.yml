name: Nota a peticion

# Lo dispara el comando /nota del bot de Telegram. Alguien de la redaccion ve
# algo que el robot no ha cogido, pega el enlace en el chat y esto corre la
# cadena completa: fuente, expediente, cifras, redaccion, auditoria y correo.
#
# El Worker de Cloudflare ya sabe hacer esto: dispara entorno.yml del mismo
# modo. Ver cloudflare-worker/worker.js en telegram-finance-bot.
#
# Sin "schedule": esto solo corre cuando alguien lo pide.
on:
  workflow_dispatch:
    inputs:
      enlace:
        description: "Direccion de la nota"
        required: true
      quien:
        description: "Quien la pidio (para el correo)"
        default: ""
      tipo:
        description: "Noticia, Opinión, Editorial, Investigación, Educación"
        default: "Noticia"

jobs:
  escribir:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Escribir la nota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          REMITENTE_NOMBRE: ${{ secrets.REMITENTE_NOMBRE }}
        run: |
          python nota.py "${{ github.event.inputs.enlace }}" \
            --tipo "${{ github.event.inputs.tipo }}" \
            --quien "${{ github.event.inputs.quien }}"

      - name: Guardar lo producido
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peticion
          path: peticion-*/
          retention-days: 14
