<style>
  /* Componente suelto: todo va bajo .se-cinta para no pisar estilos del sitio. */
  .se-cinta {
    --se-fondo: #0d1117;
    --se-texto: #e6edf3;
    --se-apagado: #8b949e;
    --se-sube: #2ea043;
    --se-baja: #f85149;
    --se-borde: #21262d;
    background: var(--se-fondo);
    color: var(--se-texto);
    font: 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    border-bottom: 1px solid var(--se-borde);
    display: flex;
    align-items: stretch;
    width: 100%;
    overflow: hidden;
  }

  /* Lo nuestro va PRIMERO y fijo. Es el dato que ningun proveedor
     internacional tiene y el que busca el lector venezolano; si se fuera
     dentro de la cinta que rota, se perderia la mitad del tiempo. */
  .se-cinta__ve {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 18px;
    flex-shrink: 0;
    border-right: 1px solid var(--se-borde);
    min-height: 46px;
  }
  .se-cinta__dato { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
  .se-cinta__etq { color: var(--se-apagado); font-weight: 600; letter-spacing: .3px; }
  .se-cinta__val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .se-cinta__var { font-variant-numeric: tabular-nums; font-size: 12px; }
  .se-cinta__var--sube { color: var(--se-sube); }
  .se-cinta__var--baja { color: var(--se-baja); }
  .se-cinta__var--igual { color: var(--se-apagado); }

  /* El widget de TradingView ocupa el resto.
     EL WIDGET NO DESFILA SOLO. Es una tira que se arrastra con el raton, no una
     marquesina; probado el 02/09/2026. Para que gire se mueve el IFRAME ENTERO
     con una animacion nuestra: los datos siguen dentro de TradingView y bajo su
     licencia, que es la condicion de todo esto. Solo se desplaza la caja.
     Para que el bucle no pegue un salto, la lista de simbolos va DUPLICADA
     dentro del propio widget: asi la segunda mitad del iframe es identica a la
     primera y desplazar un 50 % vuelve al punto de partida sin costura. Se hace
     con un solo widget a proposito; dos instancias serian dos conexiones. */
  .se-cinta__global { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .se-cinta__global .tradingview-widget-copyright { display: none; }
  /* COMO GIRA, Y POR QUE ASI.
     El widget no desfila solo: de fabrica es una tira que se arrastra. Y no
     vale duplicar la lista de simbolos dentro de un solo widget, porque el
     widget DESCARTA los que no caben: a 6400 px cada simbolo ocupa 388 px, asi
     que solo pinta unos 16 de los 38 y el punto de repetision no cae nunca en
     el 50 %. El bucle daba un salto.
     Lo que si cierra por construccion son DOS instancias identicas, cada una
     llenando su mitad de la pista: al desplazar exactamente una mitad, la
     segunda queda donde estaba la primera. Cuesta una segunda conexion y es el
     precio de que no se vea la costura.
     Los datos siguen dentro de los iframes de TradingView y bajo su licencia.
     Lo unico que se mueve es la caja. */
  .se-cinta__global { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .se-cinta__global .tradingview-widget-copyright { display: none; }

  /* La pista la crea el script de abajo. No se puede poner en el HTML: el
     script del widget elimina cualquier envoltorio que encuentre por fuera. */
  .se-cinta__pista { display: flex; width: 6400px; animation: se-desfile 40s linear infinite; }
  .se-cinta__global:hover .se-cinta__pista { animation-play-state: paused; }
  /* !important porque el widget se escribe "width: 100%" EN LINEA en cuanto
     carga, y un estilo en linea gana a la hoja. */
  .se-cinta__pista > .tradingview-widget-container { width: 3200px !important; flex: 0 0 3200px; }

  /* VELOCIDAD: se recorre una mitad, 3200 px, en este tiempo. 40s son 80 px/s,
     el paso de un cintillo de noticias. La primera version puso 150s, o sea 21
     px/s: giraba de verdad y parecia quieta. Es el unico numero que tocar. */
  @keyframes se-desfile {
    from { transform: translateX(0); }
    to   { transform: translateX(-3200px); }
  }
  /* Quien pidio no ver movimiento no lo ve: una sola tira, quieta y
     arrastrable, como viene el widget de fabrica. */
  @media (prefers-reduced-motion: reduce) {
    .se-cinta__pista { animation: none; width: 100%; }
    .se-cinta__pista > .tradingview-widget-container:nth-child(2) { display: none; }
    .se-cinta__pista > .tradingview-widget-container { width: 100% !important; flex: 1 1 auto; }
  }

  /* La atribucion de TradingView es obligatoria por su licencia. Va aqui,
     visible, y NO se quita: es el precio de poder mostrar estos datos sin
     contratar derechos de display. */
  .se-cinta__credito {
    display: flex; align-items: center; padding: 0 14px;
    font-size: 11px; color: var(--se-apagado); white-space: nowrap;
    border-left: 1px solid var(--se-borde); flex-shrink: 0;
  }
  .se-cinta__credito a { color: var(--se-apagado); text-decoration: none; }
  .se-cinta__credito a:hover { text-decoration: underline; }

  /* En movil la parte venezolana se desliza sola y el widget se apila debajo. */
  @media (max-width: 860px) {
    .se-cinta { flex-direction: column; }
    .se-cinta__ve { overflow-x: auto; border-right: none; border-bottom: 1px solid var(--se-borde); }
    .se-cinta__credito { border-left: none; padding: 6px 14px; }
  }
</style>

<script>
(function () {
  // LA PISTA SE MONTA AQUI, no en el HTML: el script del widget borra
  // cualquier envoltorio que le pongan por fuera, asi que hay que crearlo
  // DESPUES y meter las dos instancias dentro.
  (function pista() {
    var hueco = document.querySelector(".se-cinta__global");
    if (!hueco) return;
    var cajas = hueco.querySelectorAll(":scope > .tradingview-widget-container");
    if (cajas.length < 2) { setTimeout(pista, 400); return; }   // aun cargando
    var p = document.createElement("div");
    p.className = "se-cinta__pista";
    hueco.insertBefore(p, cajas[0]);
    for (var i = 0; i < cajas.length; i++) p.appendChild(cajas[i]);
  })();

  // De donde salen los datos venezolanos. Lo escribe al-cierre a las 5:30 pm
  // hora de Venezuela y se sirve desde el repo publico, que manda CORS abierto.
  // PENDIENTE PARA ALALZA: mover esto a un endpoint del backend. GitHub raw
  // sirve con cache de 5 minutos y va bien, pero no esta pensado como CDN de
  // produccion y puede limitar por volumen. Ver LEEME.md.
  var FUENTE = "https://raw.githubusercontent.com/saulbenarroch-debug/telegram-finance-bot/main/al-cierre/cinta.json";
  var CACHE = "sureconomics_cinta_datos";
  var caja = document.getElementById("se-cinta-ve");

  function numero(v) {
    return v.toLocaleString("es-VE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function pintar(datos) {
    if (!datos || !datos.valores || !datos.valores.length) { caja.remove(); return; }
    caja.innerHTML = datos.valores.map(function (v) {
      var clase = v.variacion > 0 ? "sube" : (v.variacion < 0 ? "baja" : "igual");
      var signo = v.variacion > 0 ? "+" : "";
      // El titulo del navegador lleva la fuente y la fecha: la atribucion no
      // cabe en la cinta, pero tiene que estar en alguna parte.
      var titulo = v.fuente + " · cierre del " + (datos.fecha_cierre || "");
      return '<span class="se-cinta__dato" title="' + titulo + '">' +
             '<span class="se-cinta__etq">' + v.etiqueta + '</span>' +
             '<span class="se-cinta__val">' + numero(v.valor) + '</span>' +
             '<span class="se-cinta__var se-cinta__var--' + clase + '">' +
             signo + v.variacion.toFixed(2) + '%</span></span>';
    }).join("");
  }

  // Se pinta primero lo que haya en cache para que la cinta no parpadee, y
  // luego se refresca. Si la red falla, se queda lo de antes en vez de vacio.
  try {
    var previo = sessionStorage.getItem(CACHE);
    if (previo) pintar(JSON.parse(previo));
  } catch (e) {}

  // SE REINTENTA ANTES DE RENDIRSE. La primera version se rendia al primer
  // fallo, y al probarla cayo justo en la ventana de cinco minutos de cache de
  // GitHub tras publicar el archivo: un 404 pasajero, y la mitad venezolana
  // desaparecia para ese lector hasta que recargara la pagina. Un fallo de red
  // de dos segundos no puede costar la parte de la cinta que solo tenemos
  // nosotros.
  function traer(intento) {
    fetch(FUENTE, {cache: "no-cache"})
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        pintar(d);
        try { sessionStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {}
      })
      .catch(function () {
        if (intento < 3) { setTimeout(function () { traer(intento + 1); }, intento * 4000); return; }
        // Agotados los intentos: la cinta se queda solo con TradingView. A
        // medias es mejor que con huecos o con un error a la vista.
        if (!caja.querySelector(".se-cinta__dato")) caja.remove();
      });
  }
  traer(1);
})();
</script>
